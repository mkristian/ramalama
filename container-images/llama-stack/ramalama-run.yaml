version: 2
distro_name: ramalama
apis:
- files
- inference
- tool_runtime
- vector_io
- responses
providers:
  inference:
  - provider_id: ${env.VLLM_URL:+ramalama}
    provider_type: remote::vllm
    config:
      base_url: ${env.VLLM_URL:=}
      max_tokens: ${env.VLLM_MAX_TOKENS:=4096}
  - provider_id: ${env.LLAMA_CPP_SERVER_URL:+ramalama}
    provider_type: remote::llama-cpp-server
    config:
      base_url: ${env.LLAMA_CPP_SERVER_URL:=}
  - provider_id: ${env.LLAMA_OPENAI_COMPAT_URL:+ramalama}
    provider_type: remote::llama-openai-compat
    config:
      base_url: ${env.LLAMA_OPENAI_COMPAT_URL:=}
  vector_io:
  - provider_id: ${env.MILVUS_URL:+milvus}
    provider_type: inline::milvus
    config:
      db_path: ${env.MILVUS_DB_PATH:=/opt/ramalama/var}/milvus.db
      persistence:
        namespace: vector_io::milvus
        backend: kv_default
  files:
  - provider_id: builtin-files
    provider_type: inline::localfs
    config:
      storage_dir: ${env.FILES_STORAGE_DIR:=/opt/ramalama/var/files}
      metadata_store:
        table_name: files_metadata
        backend: sql_default
  responses:
  - provider_id: builtin
    provider_type: inline::builtin
    config:
      persistence:
        agent_state:
          namespace: agents
          backend: kv_default
        responses:
          table_name: responses
          backend: sql_default
          max_write_queue_size: 10000
          num_writers: 4
  tool_runtime:
  - provider_id: ${env.BRAVE_SEARCH_API_KEY:+brave-search}
    provider_type: remote::brave-search
    config:
      api_key: ${env.BRAVE_SEARCH_API_KEY:=}
      max_results: 3
  - provider_id: ${env.TAVILY_SEARCH_API_KEY:+tavily-search}
    provider_type: remote::tavily-search
    config:
      api_key: ${env.TAVILY_SEARCH_API_KEY:=}
      max_results: 3
  - provider_id: file-search
    provider_type: inline::file-search
  - provider_id: ${env.WOLFRAM_ALPHA_API_KEY:+wolfram-alpha}
    provider_type: remote::wolfram-alpha
    config:
      api_key: ${env.WOLFRAM_ALPHA_API_KEY:=}
storage:
  backends:
    kv_default:
      type: kv_sqlite
      db_path: ${env.SQLITE_STORE_DIR:=/opt/ramalama/var}/kvstore.db
    sql_default:
      type: sql_sqlite
      db_path: ${env.SQLITE_STORE_DIR:=/opt/ramalama/var}/sql_store.db
  stores:
    metadata:
      namespace: registry
      backend: kv_default
    inference:
      table_name: inference_store
      backend: sql_default
      max_write_queue_size: 10000
      num_writers: 4
    conversations:
      table_name: openai_conversations
      backend: sql_default
    prompts:
      namespace: prompts
      backend: kv_default
    connectors:
      namespace: connectors
      backend: kv_default
registered_resources:
  models:
  - metadata: {}
    model_id: ${env.INFERENCE_MODEL}
    provider_id: ramalama
    model_type: llm
  shields: []
  vector_dbs: []
  datasets: []
  scoring_fns: []
  benchmarks: []
server:
  port: 8321
connectors: []
